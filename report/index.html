<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Report Your Issues</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../header.css">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      /* prevent page scroll */
      background-color: #0d0d0d;
    }

    .form-container {
      position: fixed;
      top: 90px;
      /* adjust based on navbar height */
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background-color: #111;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* optional: scrollbar styling */
    .form-container::-webkit-scrollbar {
      width: 10px;
    }

    .form-container::-webkit-scrollbar-thumb {
      background: #00ff88;
      border-radius: 5px;
    }
  </style>
</head>

<body class="bg-dark text-light">

  <!-- NAVBAR -->
  <nav id="topNav" class="navbar navbar-expand-lg fixed-top navbar-dark nav-transparent">
    <div class="container align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/" aria-label="Techy Bechy Home">
        <img src="../server.png" alt="Techy Bechy Logo" class="brand-logo me-2">
        <span class="fw-bold d-none d-sm-inline">Techy Bechy</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="navMenu" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="https://map.alberttalkstech.com" target="_blank"
              rel="noopener">Map</a></li>
          <li class="nav-item"><a class="nav-link" href="https://discord.gg/sKnqz6Jke5" target="_blank"
              rel="noopener">Discord</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- MAIN FORM AREA -->
  <div class="form-container">
    <iframe src="https://tally.so/r/w76ey0" title="Techy Bechy Appeal & Report Form"
      allow="fullscreen; clipboard-read; clipboard-write; encrypted-media;">
    </iframe>
  </div>

  <!-- Google Translate widget -->
  <div class="gtranslate_wrapper"></div>
  <script>
    window.gtranslateSettings = {
      "default_language": "en",
      "detect_browser_language": true,
      "languages": ["en", "zh-CN", "es", "da", "hi", "ar", "pt", "fr", "de", "ru", "ja", "ko", "it", "tr", "nl"],
      "wrapper_selector": ".gtranslate_wrapper",
      "alt_flags": { "en": "usa" }
    }
  </script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
