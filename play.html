<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Play Now • Techy Bechy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="header.css">
  <style>
    body {
      min-height: 100vh;
    }

    .copy-box {
      cursor: pointer;
      user-select: all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .corner-back {
      position: fixed;
      top: 1rem;
      right: 1rem;
    }

    .reveal-glow {
      animation: glow .9s ease;
    }

    @keyframes glow {
      0% {
        box-shadow: 0 0 0 rgba(255, 255, 255, 0);
      }

      40% {
        box-shadow: 0 0 24px rgba(255, 255, 255, .25);
      }

      100% {
        box-shadow: 0 0 0 rgba(255, 255, 255, 0);
      }
    }
  </style>
</head>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const nav = document.getElementById('topNav');
    const onScroll = () => {
      if (window.scrollY > 16) { nav.classList.add('nav-solid'); nav.classList.remove('nav-transparent'); }
      else { nav.classList.add('nav-transparent'); nav.classList.remove('nav-solid'); }
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });

    document.querySelectorAll('#navMenu .nav-link, #navMenu .btn').forEach(el => {
      el.addEventListener('click', () => {
        const collapse = bootstrap.Collapse.getOrCreateInstance(document.getElementById('navMenu'));
        collapse.hide();
      });
    });
  });
</script>
<body class="bg-dark text-white">
  <!-- NAVBAR -->
  <nav id="topNav" class="navbar navbar-expand-lg fixed-top navbar-dark nav-transparent">
    <div class="container align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/" aria-label="Techy Bechy Home">
        <img src="server.png" alt="Techy Bechy" class="brand-logo me-2">
        <span class="fw-bold d-none d-sm-inline">Techy Bechy</span>
      </a>


      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="navMenu" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <!-- 1: Features -->
          <li class="nav-item"><a class="nav-link" href="#service">Features</a></li>
          <!-- 2: Staff -->
          <li class="nav-item"><a class="nav-link" href="#staff">Staff</a></li>
          <!-- 3: Map -->
          <li class="nav-item"><a class="nav-link" href="https://map.alberttalkstech.com" target="_blank"
              rel="noopener">Map</a></li>
          <!-- 4: Discord -->
          <li class="nav-item"><a class="nav-link" href="https://discord.gg/sKnqz6Jke5" target="_blank"
              rel="noopener">Discord</a></li>
          <!-- 5: Play -->
          <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
            <a class="btn btn-primary btn-lg px-4 fw-bold btn-cta" href="/play.html">Play</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Top-right Go Back -->
  <a href="/" class="btn btn-outline-light corner-back" data-bs-toggle="tooltip" data-bs-title="Go back home">
    ← Go Back
  </a>

  <main class="container py-5">
    <header class="text-center mb-4">
      <h1 class="display-5 fw-bold">Play Now</h1>
      <p class="text-secondary mb-0">Server addresses below:</p>
    </header>

    <!-- Server IP Cards (always visible) -->
    <div id="ip-cards" class="revealed">
      <div class="row g-4 justify-content-center">
        <!-- Java -->
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0 h-100 reveal-glow">
            <div class="card-body text-dark p-4">
              <h2 class="h5 mb-2">Java Edition</h2>
              <p class="mb-3 text-muted">Multiplayer → Add Server → Server Address</p>
              <div class="input-group">
                <span id="javaAddr" class="form-control copy-box" data-copy="play.alberttalkstech.com"
                  data-bs-toggle="tooltip" data-bs-title="Click to copy">
                  play.alberttalkstech.com
                </span>
                <button class="btn btn-primary" onclick="copyFromSpan('javaAddr', this)">Copy</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Bedrock -->
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0 h-100 reveal-glow">
            <div class="card-body text-dark p-4">
              <h2 class="h5 mb-2">Bedrock Edition</h2>
              <p class="mb-3 text-muted">Play → Servers → Add Server</p>
              <div class="input-group">
                <span id="bedrockAddr" class="form-control copy-box" data-copy="bedrock.alberttalkstech.com"
                  data-bs-toggle="tooltip" data-bs-title="Click to copy">
                  bedrock.alberttalkstech.com
                </span>
                <button class="btn btn-primary" onclick="copyFromSpan('bedrockAddr', this)">Copy</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Tooltips
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
    });

    function copyFromSpan(spanId, btn) {
      const el = document.getElementById(spanId);
      const text = el.getAttribute('data-copy') || el.textContent.trim();
      navigator.clipboard.writeText(text).then(() => {
        const tooltip = bootstrap.Tooltip.getInstance(el);
        if (tooltip) {
          tooltip.setContent({ '.tooltip-inner': 'Copied!' });
          tooltip.show();
          setTimeout(() => tooltip.setContent({ '.tooltip-inner': 'Click to copy' }), 1200);
        }
        if (btn) {
          const old = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => (btn.textContent = old), 1200);
        }
      });
    }
  </script>
</body>

</html>
