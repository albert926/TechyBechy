<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Play Now • Techy Bechy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="header.css">
  <!-- Skip To Content CSS-->
  <link rel="stylesheet" href="skipToContent.css">
  <style>
    body {
      min-height: 100vh;
    }

    .copy-box {
      cursor: pointer;
      user-select: all;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    .corner-back {
      position: fixed;
      top: 1rem;
      right: 1rem;
    }

    .reveal-glow {
      animation: glow .9s ease;
    }

    @keyframes glow {
      0% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); }
      40% { box-shadow: 0 0 24px rgba(255, 255, 255, .25); }
      100% { box-shadow: 0 0 0 rgba(255, 255, 255, 0); }
    }
  </style>
</head>

<body class="bg-dark text-white">

  <a href="#ip-cards" class="skip-to-content">Skip to Content</a>

  <!-- NAVBAR -->
  <nav id="topNav" class="navbar navbar-expand-lg fixed-top navbar-dark nav-transparent">
    <div class="container align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="/" aria-label="Techy Bechy Home">
        <img src="server.png" alt="Techy Bechy Logo" class="brand-logo me-2">
        <span class="fw-bold d-none d-sm-inline">Techy Bechy</span>
      </a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu"
        aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div id="navMenu" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="https://discord.gg/sKnqz6Jke5" target="_blank" rel="noopener">Discord</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <!-- HERO INTRO -->
    <header class="text-center mb-5">
      <h1 class="display-4 fw-bold">Join Techy Bechy 🎮</h1>
      <p class="lead text-secondary">
        A community-run Minecraft server where we build, explore, and steal peoples hearts.
      </p>
    </header>

    <!-- Server IP Cards -->
    <div id="ip-cards" class="revealed">
      <div class="row g-4 justify-content-center">
        <!-- Java -->
        <div class="col-md-6 col-lg-5">
          <div class="card shadow border-0 h-100 reveal-glow">
            <div class="card-body text-dark p-4">
              <h2 class="h5 mb-2">☕ Java Edition</h2>
              <p class="mb-3 text-muted">Multiplayer → Add Server → Paste address below</p>
              <div class="input-group">
                <span id="javaAddr" class="form-control copy-box"
                  data-copy="play.alberttalkstech.com"
                  data-bs-toggle="tooltip" data-bs-title="Click to copy">
                  lifesteal.alberttalkstech.com
                </span>
                <button class="btn btn-primary" onclick="copyFromSpan('javaAddr', this)" aria-label="Copy Java server address">Copy</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Navbar scroll effect
    document.addEventListener('DOMContentLoaded', () => {
      const nav = document.getElementById('topNav');
      const onScroll = () => {
        if (window.scrollY > 16) {
          nav.classList.add('nav-solid'); nav.classList.remove('nav-transparent');
        } else {
          nav.classList.add('nav-transparent'); nav.classList.remove('nav-solid');
        }
      };
      onScroll();
      window.addEventListener('scroll', onScroll, { passive: true });

      // Collapse nav on click
      document.querySelectorAll('#navMenu .nav-link, #navMenu .btn').forEach(el => {
        el.addEventListener('click', () => {
          const collapse = bootstrap.Collapse.getOrCreateInstance(document.getElementById('navMenu'));
          collapse.hide();
        });
      });

      // Tooltips
      document.querySelectorAll('[data-bs-toggle="tooltip"]').forEach(el => new bootstrap.Tooltip(el));
    });

    // Copy to clipboard
    function copyFromSpan(spanId, btn) {
      const el = document.getElementById(spanId);
      const text = el.getAttribute('data-copy') || el.textContent.trim();
      navigator.clipboard.writeText(text).then(() => {
        const tooltip = bootstrap.Tooltip.getInstance(el);
        if (tooltip) {
          tooltip.setContent({ '.tooltip-inner': 'Copied!' });
          tooltip.show();
          setTimeout(() => tooltip.setContent({ '.tooltip-inner': 'Click to copy' }), 1200);
        }
        if (btn) {
          const old = btn.textContent;
          btn.textContent = 'Copied!';
          setTimeout(() => (btn.textContent = old), 1200);
        }
      });
    }
  </script>

  <div class="gtranslate_wrapper"></div>
  <script>window.gtranslateSettings = { "default_language": "en", "detect_browser_language": true, "languages": ["en", "zh-CN", "es", "da", "hi", "ar", "pt", "fr", "de", "ru", "ja", "ko", "it", "tr", "nl"], "wrapper_selector": ".gtranslate_wrapper", "alt_flags": { "en": "usa" } }</script>
  <script src="https://cdn.gtranslate.net/widgets/latest/float.js" defer></script>


  <!-- Skip To Content JS-->
  <script src="skipToContent.js"></script>

</body>

</html>
